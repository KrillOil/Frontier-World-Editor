name: Implementation
description: One independently reviewable editor outcome
title: ""
labels: ["implementation"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Creator outcome
      description: What becomes possible when this issue is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable statements.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: excluded
    attributes:
      label: Not in scope
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Automated and manual checks required before completion.
    validations:
      required: true

