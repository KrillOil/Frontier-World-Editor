name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl --fail --location --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          python3 -m zipfile -e godot.zip .godot-bin
          chmod +x .godot-bin/Godot_v4.7.1-stable_linux.x86_64
      - name: Run headless checks
        env:
          GODOT_BIN: ${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64
        run: ./scripts/test.sh
      - name: Check out Frontier runtime
        uses: actions/checkout@v4
        with:
          repository: KrillOil/Frontier
          path: frontier-runtime
      - name: Prove complete editor-to-runtime mission
        env:
          FRONTIER_WORLD_EDITOR_ROOT: ${{ github.workspace }}
        run: .godot-bin/Godot_v4.7.1-stable_linux.x86_64 --headless --path frontier-runtime/Game --script tests/scn_i04_reference_mission_test.gd
