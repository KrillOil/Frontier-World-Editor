name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl --fail --location --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          python3 -m zipfile -e godot.zip .godot-bin
          chmod +x .godot-bin/Godot_v4.7.1-stable_linux.x86_64
      - name: Run headless checks
        env:
          GODOT_BIN: ${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64
        run: ./scripts/test.sh
      - name: Verify terrain tool safety at 1280x720
        shell: bash
        run: |
          set -o pipefail
          wrapper_probe="$(mktemp)"
          if bash -c "printf '%s\n' 'T0_SUMMARY|checks=24|failures=0'; exit 7" 2>&1 | tee "$wrapper_probe"; then
            echo "Terrain T0 wrapper accepted a nonzero process." >&2
            exit 1
          fi
          log_file="$(mktemp)"
          if ! xvfb-run -a .godot-bin/Godot_v4.7.1-stable_linux.x86_64 --audio-driver Dummy --path . --script tests/test_terrain_t0_editor.gd 2>&1 | tee "$log_file"; then
            echo "Terrain T0 Godot process exited nonzero." >&2
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR|Parse Error|T0_FAIL' "$log_file"; then
            echo "Terrain T0 emitted a script/runtime failure." >&2
            exit 1
          fi
          if ! grep -Fq 'T0_SUMMARY|checks=24|failures=0' "$log_file"; then
            echo "Terrain T0 did not reach its fail-closed terminal marker." >&2
            exit 1
          fi
          unexpected_errors="$(grep -E '^ERROR:' "$log_file" | grep -Ev 'Pages in use exist at exit|Buffer with GL ID|RID allocations|shaders of type .* were never freed|ObjectDB instances were leaked' || true)"
          if [[ -n "$unexpected_errors" ]]; then
            echo "$unexpected_errors" >&2
            exit 1
          fi
